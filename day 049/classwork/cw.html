<!-- 

1) ახსენით რას შვება თითეული კუთვნილება:

justify-content - დახმარებით შეგვიძლია ელემენტები დავალაგოთ ჰორიზონტალურად
align-items - დახმარებით შეგვიძლია ელემენტები ვამოძრაოთ ვერტიკალურად
flex-direction - დახმარებით შეგვიძლია, რომ ელემენტებს შევუცვალოთ განლაგების მიმართულება
order - დახმარებით შეგვიძლია, რომ შევცვალოთ ელემენტების რიგითობა
align-self - დახმარებით ცვლის მხოლოდ ერთი კონკრეტული flex ელემენტის განლაგებას
flex-wrap - განსაზღვრავს თუ რა უნდა გააკეთონ ელემენტებმა როდესაც ერთ ხაზზე აღარ ეტევიან ანუ დაბლა და დაბლა ჩამოდიან
flex-flow - არის ორი flexbox თვისების გაერთიანება ერთში (flex-direction, flex-wrap)
align-content - დახმარებით შეუძლია მართოს რამდენიმე ხაზის (row და column-ის) განლაგება flexbox-ში ანუ ასწორებს მთლიან ხაზებს და რიგებს

-->
